services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    container_name: uas-sad-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: "development"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres_password@postgres:5432/uas_sad_website_buku"
      DB_SCHEMA: "uas_sad"
      JWT_SECRET_KEY: "CHANiLj-uogPpf2MYpgCd-CQzKk9kDqS3J6LURSvPekgg9R3ZMQThiF-FyHZ1COgtnSRlIxsFubtbYAF5XHWor8tyEQ"
      PASSWORD_PEPPER: "hD22R8u2jRd8RTh9z0Bgczy1Gb4CITPiR9UvGtOYiRDIKTR7k1r5GnNqcwmhj8UNbzn3-iZNbFlPtNJgic4kDw"
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend,0.0.0.0"
      ACTIVITY_LOG_ENABLED: "true"
      MONGODB_URI: "mongodb://mongodb:27017"
      MONGODB_DB: "pustaka_digital"
      MONGODB_LOG_COLLECTION: "activity_logs"
      MONGODB_TIMEOUT_MS: 2000
      OTP_SMTP_HOST: "mailpit"
      OTP_SMTP_PORT: 1025
      OTP_FROM_EMAIL: "no-reply@localhost"
      OTP_EXPIRY_SECONDS: 300
      BOOKS_COVER_PATH: "books/cover"
      BOOKS_BODY_PATH: "books/body"
    volumes:
      - ../app:/app/app
      - ../configuration:/app/configuration
      - ../statics:/app/statics
      - ../templates:/app/templates
      - ../main.py:/app/main.py
      - ../books:/app/books
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: uas-sad-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: uas_sad_website_buku
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - ../app/schemas:/app_schemas:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uas_sad_website_buku"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  mongodb:
    image: mongo:4.4
    container_name: uas-sad-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: uas-sad-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
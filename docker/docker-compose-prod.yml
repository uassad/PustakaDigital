services:
  caddy:
    image: caddy:2-alpine
    container_name: uas-sad-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # Enables HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ..
      # FIle path dockerfile harus disesuaikan Dockerfile sesuai os-nya
      dockerfile: docker/Dockerfile.ubuntu
      target: production
    container_name: uas-sad-backend
    restart: unless-stopped
    expose:
      - "8000" # Only exposed internally to Caddy
    env_file:
      - ../.secrets/.env.docker
    environment:
      ENVIRONMENT: "production"
      # ====================================
      # VERCEL DOMAIN
      # CORS_ORIGINS: "https://yourdomain.com"
      # ALLOWED_HOSTS: "yourdomain.com,backend"
      # ====================================
      ACTIVITY_LOG_ENABLED: "true"
      MONGODB_URI: "mongodb://mongodb:27017"
      MONGODB_DB: "pustaka_digital"
      MONGODB_LOG_COLLECTION: "activity_logs"
      MONGODB_TIMEOUT_MS: 2000
      OTP_SMTP_HOST: "mailpit"
      OTP_SMTP_PORT: 1025
      # ====================================
      # VERCEL DOMAIN
      # OTP_FROM_EMAIL: "no-reply@yourdomain.com"
      OTP_FROM_EMAIL: "no-reply@localhost"
      # ====================================
      OTP_EXPIRY_SECONDS: 300
      BOOKS_COVER_PATH: "books/cover"
      BOOKS_BODY_PATH: "books/body"
    volumes:
      - ../books:/app/books
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: uas-sad-postgres
    restart: unless-stopped
    env_file:
      - ../.secrets/.postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - ../app/schemas:/app_schemas:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  mongodb:
    image: mongo:4.4
    container_name: uas-sad-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: uas-sad-mailpit
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  caddy_data:
  caddy_config:

<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Masuk{% endblock %} · Pustaka Digital</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
{# KEAMANAN: tidak ada <script> inline, onclick=, atau style= di seluruh template (CSP: script-src 'self'; style-src 'self').
   Variabel Jinja2 di-escape otomatis (autoescape). #}
<body class="{% block body_class %}auth{% endblock %}">
  <a class="skip" href="#app">Lewati ke konten</a>
  <div class="{% block shell_class %}auth-shell{% endblock %}">
    <aside class="auth-brand">
      <a class="brand" href="/">Pustaka<span>Digital</span></a>
      <p class="tagline">Platform membaca e-book.</p>
    </aside>
    <main id="app" class="auth-main">
      {% block content %}{% endblock %}
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  {% block scripts %}{% endblock %}
</body>
</html>
